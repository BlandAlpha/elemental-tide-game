                },
                'skill': {
                    'Commander': `[战术护盾]\n为基地提供 200 点护盾(10秒)。护盾消失或被击破时，释放一个短暂的减速波(1.5秒)。`,
                    'Berserker': `[过载]\n在 5 秒内，所有新单位获得双倍伤害，但对你造成 8% 的反噬伤害。`,
                    'Swarm': `[紧急增援]\n立即从基地召唤 20 个基础单位，并使你所有单位获得 3 秒的移速加成。`,
                    'Elementalist': `[烈焰风暴]\n在战场中段召唤火焰风暴(5秒)，对穿过的<span style="color: red;">所有单位(敌我双方)</span>施加“燃烧”效果。`,
                    'Illusionist': `[诡计传送]\n立即将你最后召唤的 5 个单位传送到战场中段，并使其获得 3 秒的移速加成。`,
                    'Aegis': `[神圣庇护]\n使你的基地进入<span style="color: yellow;">无敌状态(8秒)</span>，但期间<span style="color: red;">能量获取完全停止</span>。`
                }
            };
            
            function showTooltip(e) {
                const target = e.currentTarget;
                const id = target.dataset.tooltipId; // 'quantity', 'damage', 'tactic', 'skill'
                const title = target.dataset.tooltipTitle;
                
                let data = tooltipData[id];
                tooltipTitle.textContent = title;
                
                tooltipBonus.style.display = 'none';
                tooltipCost.style.display = 'none';
                tooltipExpertise.style.display = 'none';

                if (id === 'tactic') {
                    tooltipDesc.innerHTML = data.desc[playerStats.class] || data.desc['Commander'];
                    const expertise = playerStats.expertiseTactic;
                    if (expertise) {
                        tooltipExpertise.innerText = data.expertise[expertise];
                        tooltipExpertise.style.display = 'block';
                    }
                } else if (id === 'skill') {
                     // 动态更新消耗
                     tooltipData.skill.Commander = `[战术护盾]\n为基地提供 200 点护盾(10秒)。护盾消失或被击破时，释放一个短暂的减速波(1.5秒)。\n<em class="cost">下次消耗 ${playerStats.aetherCost}</em>`;
                     tooltipData.skill.Berserker = `[过载]\n在 5 秒内，所有新单位获得双倍伤害，但对你造成 8% 的反噬伤害。\n<em class="cost">下次消耗 ${playerStats.aetherCost}</em>`;
                     tooltipData.skill.Swarm = `[紧急增援]\n立即从基地召唤 20 个基础单位，并使你所有单位获得 3 秒的移速加成。\n<em class="cost">下次消耗 ${playerStats.aetherCost}</em>`;
                     tooltipData.skill.Elementalist = `[烈焰风暴]\n在战场中段召唤火焰风暴(5秒)，对穿过的<span style="color: red;">所有单位(敌我双方)</span>施加“燃烧”效果。\n<em class="cost">下次消耗 ${playerStats.aetherCost}</em>`;
                     tooltipData.skill.Illusionist = `[诡计传送]\n立即将你最后召唤的 5 个单位传送到战场中段，并使其获得 3 秒的移速加成。\n<em class="cost">下次消耗 ${playerStats.aetherCost}</em>`;
                     tooltipData.skill.Aegis = `[神圣庇护]\n使你的基地进入<span style="color: yellow;">无敌状态(8秒)</span>，但期间<span style="color: red;">能量获取完全停止</span>。\n<em class="cost">下次消耗 ${playerStats.aetherCost}</em>`;
                     
                     tooltipDesc.innerHTML = data[playerStats.class] || data['Commander'];
                } else {
                    tooltipDesc.innerText = data.desc;
                    tooltipBonus.innerHTML = data.bonus; // Use innerHTML for color
                    tooltipCost.innerHTML = data.cost;   // Use innerHTML for color
                    tooltipBonus.style.display = 'block';
                    tooltipCost.style.display = 'block';
                    
                    const expertisePath = id === 'quantity' ? 'expertiseQuantity' : 'expertiseDamage';
                    const expertise = playerStats[expertisePath];
                    if (expertise) {
                        tooltipExpertise.innerText = data.expertise[expertise];
                        tooltipExpertise.style.display = 'block';
                    }
                }
                
                const rect = target.getBoundingClientRect();
                tooltip.style.display = 'block';
                tooltip.style.left = `${W / 2 - tooltip.offsetWidth / 2}px`; // 居中
                tooltip.style.bottom = `${H - rect.top + 8}px`; // 在按钮上方 8px
            }
            
            function hideTooltip() {
                tooltip.style.display = 'none';
            }

            // --- 事件监听 ---
            window.addEventListener('resize', resizeCanvas);
            document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

            // 职业选择按钮
            document.getElementById('start-commander').addEventListener('click', () => startGame('Commander'));
            document.getElementById('start-berserker').addEventListener('click', () => startGame('Berserker'));
            document.getElementById('start-swarm').addEventListener('click', () => startGame('Swarm'));
            // v18 GAI: 新职业
            document.getElementById('start-elementalist').addEventListener('click', () => startGame('Elementalist'));
            document.getElementById('start-illusionist').addEventListener('click', () => startGame('Illusionist'));
            // v20 GAI: 圣盾
            document.getElementById('start-aegis').addEventListener('click', () => startGame('Aegis'));
            
            restartButton.addEventListener('click', init); // 重新开始按钮
            
            // v15 GAI: 专精选择按钮
            expertiseChoice1.addEventListener('click', () => selectExpertise(expertiseChoice1.dataset.choice));
            expertiseChoice2.addEventListener('click', () => selectExpertise(expertiseChoice2.dataset.choice));

            // 升级按钮
            document.getElementById('upgrade-quantity').addEventListener('click', () => playerUpgrade('quantity'));
            document.getElementById('upgrade-damage').addEventListener('click', () => playerUpgrade('damage'));
            document.getElementById('upgrade-tactic').addEventListener('click', () => playerUpgrade('tactic'));
            
            // v12 GAI: 技能按钮
            skillButton.addEventListener('click', playerActivateSkill);

            // v12 GAI: Tooltip 提示框事件
            document.querySelectorAll('.tooltip-trigger').forEach(el => {
                el.addEventListener('mousedown', showTooltip);
                el.addEventListener('mouseup', hideTooltip);
                el.addEventListener('mouseleave', hideTooltip);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); showTooltip(e); }, { passive: false });
                el.addEventListener('touchend', (e) => { e.preventDefault(); hideTooltip(); }, { passive: false });
            });

            // 初始启动
            init();
        });
    </script>
</body>
</html>
