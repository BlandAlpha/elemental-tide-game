<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>元素洪流 v25 (重构版)</title>
    
    <!-- 1. 样式表被分离出去 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 
      Tailwind 仍然保留, 因为它是基础样式库。
      你也可以选择下载它并本地化, 但 CDN 很方便。
    -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white w-full h-screen flex items-center justify-center overflow-hidden">

    <!-- HTML 结构保持不变 -->
    <div id="game-container" class="relative w-full h-full bg-black shadow-2xl overflow-hidden">
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="absolute inset-0 w-full h-full flex flex-col justify-between z-10 pointer-events-none">
            
            <!-- AI UI (顶部) -->
            <div id="ai-ui-bar" class="bg-gray-800 bg-opacity-70 backdrop-blur-sm p-2 shadow-lg w-full pointer-events-auto transition-all duration-100">
                <!-- ... AI UI 内容不变 ... -->
                 <div class="flex justify-between items-center gap-2">
                    <div>
                        <h2 class="text-sm font-bold text-blue-400">寒冰之源 (AI)</h2>
                        <div class="text-xs font-bold text-cyan-300">职业: <span id="ai-class">统帅</span></div>
                        <div class="text-xs opacity-80">
                            等级: <span id="ai-level" class="font-bold">1</span> 
                            (数:<span id="ai-level-speed">1</span> 
                            伤:<span id="ai-level-power">1</span> 
                            战:<span id="ai-level-special">0</span>)
                        </div>
                    </div>
                    <span id="game-timer-display" class="text-2xl font-bold text-yellow-300">5:00</span>
                    <div class="flex flex-col items-end flex-1">
                        <span id="ai-health-text" class="font-bold text-green-300 text-sm">100%</span>
                        <div class="w-full max-w-xs h-3 bg-gray-600 rounded-full overflow-hidden">
                            <div id="ai-health-bar" class="h-full bg-green-500 transition-all duration-100 ease-linear" style="width: 100%;"></div>
                        </div>
                        <div id="ai-shield-ui" class="w-full max-w-xs h-3 bg-gray-600 rounded-full overflow-hidden mt-1 relative" style="display: none;">
                            <div id="ai-shield-bar" class="h-full bg-blue-400 transition-all duration-100 ease-linear" style="width: 100%;"></div>
                            <span id="ai-shield-timer" class="absolute inset-0 text-center text-xs text-white font-bold" style="text-shadow: 1px 1px 0 #000;">10.0s</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 玩家 UI (底部) -->
            <div id="player-ui-bar" class="bg-gray-800 bg-opacity-70 backdrop-blur-sm p-2 pb-20 shadow-lg w-full pointer-events-auto transition-all duration-100">
                <!-- ... 玩家 UI 内容不变 ... -->
                <div class="flex justify-between items-center gap-2 mb-2">
                    <div>
                        <h2 class="text-sm font-bold text-red-400">火焰之源 (玩家)</h2>
                        <div class="text-xs font-bold text-red-300">职业: <span id="player-class">统帅</span></div>
                        <div class="text-xs opacity-80">
                            等级: <span id="player-total-level" class="font-bold">3</span> 
                            (数:<span id="player-ui-level-speed">1</span> 
                            伤:<span id="player-ui-level-power">1</span> 
                            战:<span id="player-ui-level-special">0</span>)
                        </div>
                        <div class="text-lg">
                            <span class="font-semibold">能量: </span>
                            <span id="player-energy" class="font-bold text-yellow-300">100</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end flex-1">
                        <span id="player-health-text" class="font-bold text-green-300 text-sm">100%</span>
                        <div class="w-full max-w-xs h-3 bg-gray-600 rounded-full overflow-hidden">
                            <div id="player-health-bar" class="h-full bg-green-500 transition-all duration-100 ease-linear" style="width: 100%;"></div>
                        </div>
                        <div id="player-shield-ui" class="w-full max-w-xs h-3 bg-gray-600 rounded-full overflow-hidden mt-1 relative" style="display: none;">
                            <div id="player-shield-bar" class="h-full bg-blue-400 transition-all duration-100 ease-linear" style="width: 100%;"></div>
                            <span id="player-shield-timer" class="absolute inset-0 text-center text-xs text-white font-bold" style="text-shadow: 1px 1px 0 #000;">10.0s</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2 mb-2">
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-0.5">
                            <div class="text-sm font-bold text-purple-300">以太</div>
                            <span id="aether-text" class="text-sm font-bold text-purple-300">0</span>
                        </div>
                        <div class="w-full h-3 bg-gray-600 rounded-full overflow-hidden">
                            <div id="aether-bar" class="h-full bg-purple-500 transition-all duration-100 ease-linear" style="width: 0%;"></div>
                        </div>
                    </div>
                    <button id="skill-button" class="btn-skill p-2 bg-purple-600 hover:bg-purple-700 rounded-lg shadow-md text-xs text-center" disabled>
                        <div>释放技能</div>
                        <div class="font-bold">消耗: <span id="aether-cost-text">100</span></div>
                    </button>
                    <span class="tooltip-trigger" 
                          data-tooltip-title="主动技能"
                          data-tooltip-id="skill">?</span>
                </div>
                <div class="flex justify-around gap-1">
                    <button id="upgrade-quantity" class="btn-upgrade flex-1 p-2 bg-red-600 hover:bg-red-700 rounded-lg shadow-md text-xs text-center">
                        <div>数量 I (<span id="cost-quantity">50</span>)</div>
                        <div class="font-bold">LV: <span id="level-quantity">1</span></div>
                    </button>
                    <span class="tooltip-trigger" 
                          data-tooltip-title="升级：数量"
                          data-tooltip-id="quantity">?</span>
                    <button id="upgrade-damage" class="btn-upgrade flex-1 p-2 bg-red-700 hover:bg-red-800 rounded-lg shadow-md text-xs text-center">
                        <div>伤害 II (<span id="cost-damage">100</span>)</div>
                        <div class="font-bold">LV: <span id="level-damage">1</span></div>
                    </button>
                    <span class="tooltip-trigger"
                          data-tooltip-title="升级：伤害"
                          data-tooltip-id="damage">?</span>
                    <button id="upgrade-tactic" class="btn-upgrade flex-1 p-2 bg-red-800 hover:bg-red-900 rounded-lg shadow-md text-xs text-center">
                        <div>战术 III (<span id="cost-tactic">150</span>)</div>
                        <div class="font-bold">LV: <span id="level-tactic">0</span></div>
                    </button>
                    <span class="tooltip-trigger"
                          data-tooltip-title="升级：战术"
                          data-tooltip-id="tactic">?</span>
                </div>
            </div>
        </div>

        <!-- 弹窗 -->
        <div id="modal" class="absolute inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
             <!-- ... 弹窗内容不变 ... -->
             <div class="bg-gray-800 p-6 rounded-lg shadow-2xl w-11/12 max-w-sm">
                <h1 id="modal-title" class="text-2xl font-bold mb-4 text-center text-yellow-300">元素洪流</h1>
                <div id="class-selection" class="space-y-3">
                    <h3 class="text-center font-bold text-lg">选择你的成长路线:</h3>
                    <p class="text-center text-xs opacity-80">在路径达到 **LV.3 或 LV.4** 时，可解锁强大的**路径专精**！</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="start-commander" class="btn-class p-3 bg-gray-600 hover:bg-gray-700 rounded-lg text-left h-full">
                            <div class="font-bold text-lg">统帅</div>
                            <div class="text-xs opacity-90">
                                均衡型。<span class="text-yellow-300">[战术护盾]</span>, <span class="text-yellow-300">[守护巨兽]</span> (分裂)。
                            </div>
                        </button>
                        <button id="start-berserker" class="btn-class p-3 bg-red-700 hover:bg-red-800 rounded-lg text-left h-full">
                            <div class="font-bold text-lg">狂战士</div>
                            <div class="text-xs opacity-90">
                                伤害型。<span class="text-yellow-300">[过载]</span> (双倍伤害), <span class="text-yellow-300">[自爆巨兽]</span>。
                            </div>
                        </button>
                        <button id="start-swarm" class="btn-class p-3 bg-blue-700 hover:bg-blue-800 rounded-lg text-left h-full">
                            <div class="font-bold text-lg">虫群</div>
                            <div class="text-xs opacity-90">
                                数量型。<span class="text-yellow-300">[紧急增援]</span>, <span class="text-yellow-300">[孵化领主]</span>。
                            </div>
                        </button>
                        <button id="start-elementalist" class="btn-class p-3 bg-orange-700 hover:bg-orange-800 rounded-lg text-left h-full">
                            <div class="font-bold text-lg">元素使</div>
                            <div class="text-xs opacity-90">
                                范围/持续。<span class="text-yellow-300">[烈焰风暴]</span> (敌我皆伤), <span class="text-yellow-300">[熔火核心]</span>。
                            </div>
                        </button>
                        <button id="start-illusionist" class="btn-class p-3 bg-indigo-700 hover:bg-indigo-800 rounded-lg text-left h-full">
                            <div class="font-bold text-lg">幻术师</div>
                            <div class="text-xs opacity-90">
                                诡计/闪避。<span class="text-yellow-300">[相位迁跃]</span>, <span class="text-yellow-300">[幻影刺客]</span>。
                            </div>
                        </button>
                        <button id="start-aegis" class="btn-class p-3 bg-emerald-700 hover:bg-emerald-800 rounded-lg text-left h-full">
                            <div class="font-bold text-lg">圣盾</div>
                            <div class="text-xs opacity-90">
                                防御/治疗。<span class="text-yellow-300">[奉献]</span> (减伤光环), <span class="text-yellow-300">[圣骑士]</span> (死亡治疗)。
                            </div>
                        </button>
                    </div>
                </div>
                <p id="modal-message" class="text-base mb-4 text-center hidden"></p> 
                <div id="game-over-buttons" class="mt-4 space-y-2 hidden">
                    <button id="restart-button" class="btn-class w-full px-6 py-3 bg-green-600 hover:bg-green-700 text-white text-xl font-bold rounded-lg shadow-lg transition duration-200 transform hover:scale-105">
                        重新开始
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 专精弹窗 -->
        <div id="expertise-modal" class="absolute inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50" style="display: none;">
            <!-- ... 专精弹窗内容不变 ... -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-2xl w-11/12 max-w-sm">
                <h1 id="expertise-title" class="text-2xl font-bold mb-4 text-center text-yellow-300">路径专精</h1>
                <p class="text-center text-base mb-4">为你的路径选择一个永久专精！</p>
                <div class="space-y-3">
                    <button id="expertise-choice-1" class="btn-expertise w-full p-3 bg-gray-600 hover:bg-gray-700 rounded-lg text-left">
                        <div id="expertise-name-1" class="font-bold text-lg">专精 1</div>
                        <div id="expertise-desc-1" class="text-sm opacity-90">描述 1</div>
                    </button>
                    <button id="expertise-choice-2" class="btn-expertise w-full p-3 bg-gray-600 hover:bg-gray-700 rounded-lg text-left">
                        <div id="expertise-name-2" class="font-bold text-lg">专精 2</div>
                        <div id="expertise-desc-2" class="text-sm opacity-90">描述 2</div>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 提示框 -->
        <div id="tooltip">
             <!-- ... 提示框内容不变 ... -->
             <h4 id="tooltip-title">Tooltip Title</h4>
            <p id="tooltip-desc">Description goes here.</p>
            <em id="tooltip-bonus">Bonus effect.</em>
            <em id="tooltip-cost" class="cost">Cost effect.</em>
            <div id="tooltip-expertise" style="display: none;"></div>
        </div>

     </div>

     <!-- 
        2. 巨大的 <script> 块被移除
        3. 替换为单个 <script type="module">, 这是新的入口点
     -->
     <script type="module" src="js/main.js"></script>
 </body>
 </html>
